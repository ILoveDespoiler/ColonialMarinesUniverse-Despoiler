- type: entity
  abstract: true
  id: CMU14PathogenTrapBase
  name: pathogen trap
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: DeployTrapsBlocker
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      trap_trigger:
        shape:
          !type:PhysShapeCircle
          radius: 0.5
        hard: false
        layer:
        - Opaque
        mask:
        - MobLayer
  - type: RequireProjectileTarget
  - type: Clickable
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_deployed_trap.rsi
    drawdepth: FloorObjects
    state: trap_boiler
  - type: Damageable
    damageModifierSet: Resin
  - type: Injurable
    damageContainer: StructuralXeno
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: XenoResinBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 10
      behaviors:
      - !type:BurnBodyBehavior { }
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    stepOn: false
  - type: TriggerOnStepTrigger
  - type: XenoDeployedTraps
    stunDuration: 0
  - type: XenoFriendly
  - type: XenoConstruct
  - type: RMCNightVisionVisible
    priority: -1
    transparency: 0.2
  - type: DeletedByWeedKiller
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        Heat: 2

- type: entity
  id: CMU14PathogenSnareResin
  name: Barbed Mycelium
  description: A mat of pale mycelium laced with hooked barbs. It clings and tears.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: false
        layer:
        - SlipLayer
        mask:
        - ItemMask
  - type: Clickable
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin.rsi  
    state: sticky_resin
    drawdepth: FloorObjects
  - type: Icon
    sprite: _RMC14/Structures/Xenos/xeno_resin.rsi
    state: sticky_resin
  - type: ResinSlowdownModifier
    outsiderSpeedModifier: 0.25
    outsiderSpeedModifierArmor: 0.32
  - type: DamageOnCollide
    canRehit: true
    armorPenetration: 50
    damage:
      types:
        Piercing: 8
    whitelist:
      components:
      - Marine
  - type: Damageable
    damageModifierSet: Resin
  - type: Injurable
    damageContainer: StructuralXeno
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 45
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: XenoResinBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 10
      behaviors:
      - !type:BurnBodyBehavior { }
  - type: ImmuneToUnarmed
  - type: XenoFriendly
  - type: XenoConstruct
  - type: XenoConstructionPlasmaCost
    plasma: 70
  - type: XenoConstructionBuildSpeed
    buildTimeMult: 0.5
  - type: DeletedByWeedKiller
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        Heat: 2
  - type: RMCNightVisionVisible
    priority: -1
    transparency: 0.2

- type: entity  
  parent: CMU14PathogenTrapBase  
  id: CMU14PathogenSmokeTrap  
  name: Smoke Sac
  description: A small pustule that bursts into concealing smoke when disturbed.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_deployed_trap.rsi #testing
    state: trap_boiler #testing
  - type: SpawnOnTrigger
    proto: CMUPathogenSmokeCloud
  - type: DeleteOnTrigger
  - type: XenoConstructionPlasmaCost
    plasma: 40
  - type: EmitSoundOnTrigger
    sound: /Audio/Effects/smoke.ogg
    positional: true
  - type: XenoSecretionLimited
    id: CMU14PathogenSmokeTrap
    amount: 6
  - type: XenoConstructionBuildSpeed  
    buildTimeMult: 0.5

- type: entity
  parent: CMU14PathogenTrapBase
  id: CMU14PathogenBlastTrap
  name: Rupture Sac
  description: A volatile pustule that detonates when disturbed.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_deployed_trap.rsi #testing
    state: trap_boiler   # testin g
    drawdepth: FloorObjects
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: RMC
    maxIntensity: 10
    intensitySlope: 5
    totalIntensity: 55
    canCreateVacuum: false
  - type: CMExplosionEffect
    maxShrapnel: 0
  - type: DeleteOnTrigger
  - type: XenoConstructionPlasmaCost
    plasma: 175
  - type: XenoSecretionLimited
    id: CMU14PathogenBlastTrap
    amount: 1
  - type: XenoConstructionBuildSpeed
    buildTimeMult: 1.0

- type: entity
  parent: XenoBaseProjectile
  id: CMUProjectileBoneSpine
  name: Bone Spine
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Materials/shards.rsi
    layers:
    - state: bonechips
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 25
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: CMUProjectileShrapnel
    severity: 15
  - type: XenoProjectile
    deleteOnFriendlyXeno: false
  - type: ProjectileMaxRange
    max: 8

- type: entity
  parent: CMU14PathogenTrapBase
  id: CMU14PathogenShrapnelTrap
  name: Spine Sac
  description: A hardened sac of bone spines. Detonates when disturbed, launching spines in every direction.
  components:
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
        ents: []
        showEnts: False
        occludes: True
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_deployed_trap.rsi
    state: trap_boiler
    drawdepth: FloorObjects
  - type: EmitSoundOnTrigger
    sound: /Audio/Effects/snap.ogg
    positional: true
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: CMUProjectileBoneSpine
    capacity: 24
    minVelocity: 1.5
    maxVelocity: 3
  - type: ClusterLimitHits
    limit: 2
  - type: RequireProjectileTarget
  - type: DeleteOnTrigger
  - type: XenoConstructionPlasmaCost
    plasma: 120
  - type: XenoSecretionLimited
    id: CMU14PathogenSpineTrap
    amount: 2
  - type: XenoConstructionBuildSpeed
    buildTimeMult: 0.75

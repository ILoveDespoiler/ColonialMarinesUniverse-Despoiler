- type: entity
  abstract: true
  parent: CMBaseXenoStructure
  id: CMU14PathogenTrapBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        layer:
        - BulletImpassable
      trap_trigger:
        shape:
          !type:PhysShapeCircle
          radius: 0.5
        hard: false
        layer:
        - Opaque
        mask:
        - MobLayer
  - type: Clickable
  - type: Sprite
    drawdepth: FloorObjects
  - type: Damageable
    damageContainer: StructuralXeno
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 10
      behaviors:
      - !type:BurnBodyBehavior { }
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    stepOn: false
  - type: TriggerOnStepTrigger
  - type: SpawnOnTrigger
    proto: CMUPathogenSmokeCloud
  - type: DeleteOnTrigger
  - type: DeployTrapsBlocker
  - type: XenoFriendly
  - type: XenoConstruct
  - type: RMCNightVisionVisible
    priority: -1
    transparency: 0.2
  - type: DeletedByWeedKiller
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        Heat: 2


- type: entity  
  parent: CMU14PathogenTrapBase  
  id: CMU14PathogenSmokeTrap  
  name: smoke sac
  description: A small pustule that bursts into concealing smoke when disturbed.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_deployed_trap.rsi #testing
    state: trap_boiler #testing
  - type: SpawnOnTrigger
    proto: CMUPathogenSmokeCloud
  - type: DeleteOnTrigger
  - type: XenoConstructionPlasmaCost
    plasma: 60
  - type: XenoSecretionLimited
    id: CMU14PathogenSmokeTrap
    amount: 6

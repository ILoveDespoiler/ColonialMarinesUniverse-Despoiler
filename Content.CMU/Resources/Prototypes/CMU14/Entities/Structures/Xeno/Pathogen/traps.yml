- type: entity
  abstract: true
  id: CMU14PathogenTrapBase
  name: pathogen trap
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: DeployTrapsBlocker
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        layer:
        - BulletImpassable
        restitution: 0.3
        friction: 0.2
      trap_trigger:
        shape:
          !type:PhysShapeCircle
          radius: 0.5
        hard: false
        layer:
        - Opaque
        mask:
        - MobLayer
  - type: Clickable
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_deployed_trap.rsi
    drawdepth: FloorObjects
    state: trap_boiler
  - type: Damageable
    damageModifierSet: Resin
  - type: Injurable
    damageContainer: StructuralXeno
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: XenoResinBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 10
      behaviors:
      - !type:BurnBodyBehavior { }
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    stepOn: false
  - type: TriggerOnStepTrigger
  - type: XenoDeployedTraps
    stunDuration: 0
  - type: XenoFriendly
  - type: XenoConstruct
  - type: RMCNightVisionVisible
    priority: -1
    transparency: 0.2
  - type: DeletedByWeedKiller
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        Heat: 2

- type: entity  
  parent: CMU14PathogenTrapBase  
  id: CMU14PathogenSmokeTrap  
  name: Smoke Sac
  description: A small pustule that bursts into concealing smoke when disturbed.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_deployed_trap.rsi #testing
    state: trap_boiler #testing
  - type: SpawnOnTrigger
    proto: CMUPathogenSmokeCloud
  - type: DeleteOnTrigger
  - type: XenoConstructionPlasmaCost
    plasma: 100
  - type: EmitSoundOnTrigger
    sound: /Audio/Effects/smoke.ogg
    positional: true
  - type: XenoSecretionLimited
    id: CMU14PathogenSmokeTrap
    amount: 6

- type: entity
  parent: CMU14PathogenTrapBase
  id: CMU14PathogenBlastTrap
  name: Rupture Sac
  description: A volatile pustule that detonates when disturbed.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_deployed_trap.rsi #testing
    state: trap_boiler   # testin g
  - type: Explosive
    explosionType: RMC
    maxIntensity: 10
    intensitySlope: 5
    totalIntensity: 55
    canCreateVacuum: false
  - type: ExplodeOnTrigger
  - type: CMExplosionEffect
  - type: RMCScorchEffect
  - type: XenoConstructionPlasmaCost
    plasma: 200
  - type: XenoSecretionLimited
    id: CMU14PathogenBlastTrap
    amount: 1
